<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal | The Collective</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .msg-investigator { background: #1f2937; border-left: 4px solid #6366f1; }
        .msg-client { background: #374151; border-right: 4px solid #10b981; margin-left: auto; }
    </style>
</head>
<body class="antialiased h-screen flex flex-col">

    <nav class="w-full z-50 glass border-b border-white/10 shrink-0">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="font-bold tracking-widest text-white">SECURE PORTAL</div>
            <div class="flex space-x-4">
                <button onclick="logout()" class="text-sm text-gray-400 hover:text-white transition">Log Out</button>
                <button onclick="window.location.replace('https://www.weather.com')" class="bg-red-900/80 hover:bg-red-800 text-red-100 px-3 py-1 rounded text-sm font-semibold transition">QUICK EXIT</button>
            </div>
        </div>
    </nav>

    <main class="flex-1 overflow-hidden flex flex-col max-w-4xl mx-auto w-full p-4">
        <div class="glass flex-1 flex flex-col rounded-xl overflow-hidden">
            <!-- Header -->
            <div class="p-4 border-b border-white/10 bg-black/40">
                <h2 class="font-bold text-lg">Active Case Communication</h2>
                <p class="text-xs text-green-400 font-mono">Connection Encrypted</p>
            </div>
            
            <!-- Chat Box -->
            <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
                <!-- Messages injected here -->
            </div>

            <!-- Input Area -->
            <form id="chatForm" class="p-4 border-t border-white/10 bg-black/40 flex space-x-2">
                <input type="text" id="msgInput" required placeholder="Type your secure message here..." class="flex-1 bg-black/50 border border-white/10 rounded px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-white text-black font-semibold px-6 py-2 rounded hover:bg-gray-200 transition">Send</button>
            </form>
        </div>
    </main>

    <script>
        const API_URL = 'https://the-collective-hjds.onrender.com/api';
        const token = localStorage.getItem('collective_token');

        if (!token) {
            window.location.href = 'index.html';
        }

        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const msgInput = document.getElementById('msgInput');

        function renderMessage(msg) {
            const div = document.createElement('div');
            const isClient = msg.sender === 'client';
            div.className = p-3 rounded-lg max-w-[80%] \;
            
            const senderName = isClient ? 'You' : 'Lead Investigator';
            const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            div.innerHTML = 
                <div class="flex justify-between items-end mb-1 space-x-4">
                    <span class="text-xs font-bold \">\</span>
                    <span class="text-[10px] text-gray-500">\</span>
                </div>
                <p class="text-sm text-gray-200">\</p>
            ;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function fetchMessages() {
            try {
                const res = await fetch(\/messages, {
                    headers: { 'Authorization': Bearer \ }
                });
                if (!res.ok) throw new Error("Auth failed");
                const messages = await res.json();
                chatBox.innerHTML = '';
                messages.forEach(renderMessage);
            } catch (err) {
                alert("Session expired. Please log in again.");
                logout();
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value;
            msgInput.value = '';
            
            try {
                const res = await fetch(\/messages, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': Bearer \
                    },
                    body: JSON.stringify({ text })
                });
                if (res.ok) {
                    const newMsg = await res.json();
                    renderMessage(newMsg);
                }
            } catch (err) {
                console.error("Failed to send message");
            }
        });

        function logout() {
            localStorage.removeItem('collective_token');
            window.location.href = 'index.html';
        }

        fetchMessages();
    </script>
</body>
</html>
